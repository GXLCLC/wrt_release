REPO_URL=https://github.com/immortalwrt/immortalwrt.git
REPO_BRANCH=master
BUILD_DIR=immortalwrt
# 2026-11-09：X86_64 不再内置 Docker 插件，故移除 docker_deps 片段
# （docker_deps.config 是 Docker v29 nftables 运行依赖，配合 Dockerman / dockerd 使用）；
# 保留空的 proxy 片段，因为 build.sh 的片段校验要求所列文件存在。
CONFIG_FRAGMENTS=proxy
# 2026-11-09：按需求把 X86_64 默认管理后台地址设为 192.168.3.1。
# build.sh 读取该键并传给 update.sh；此前只有京东云 IPQ60xx 配置了该键，
# 所以上一轮查询时 x64 仍沿用 update.sh 的全局默认 192.168.1.1。
LAN_ADDR=192.168.3.1
# 2026-11-09：设备级 Argon 在线壁纸来源覆盖（仅 X86_64）。
# bing 表示使用 Bing 在线壁纸；未配置该键的其它设备沿用主题内建壁纸（none）。
# build.sh 导出为环境变量，编译期注入 wrt_core/patches/993_default_settings.sh，
# 固件首次启动时通过 uci 写入 /etc/config/argon 的 option online_wallpaper。
ARGON_ONLINE_WALLPAPER=bing
# 2026-11-09：X86_64 专属编译期开关（由 build.sh 导出为环境变量）。
# target_fixes.sh 的 apply_x64_device_defaults() 仅在为 1 时注入
# /sbin/tempinfo（CPU 温度）与 994_x64_firewall.sh（防火墙 / 软件卸载默认值）。
# 其它设备不配置该键，行为保持不变。
X64_DEVICE_DEFAULTS=1
