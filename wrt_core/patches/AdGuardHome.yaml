# 2026-11-09：AdGuard Home 默认配置（适用于所有设备，不限于 X86_64）。
# 来源：https://github.com/ZqinKing/luci-app-adguardhome 的 root/etc/AdGuardHome.yaml
#       （schema_version: 10），由 wrt_core/modules/service_fixes.sh 的
#       update_adguardhome() 在克隆源码后覆盖写入包内同名文件，
#       并同时覆盖 root/usr/share/AdGuardHome/AdGuardHome_template.yaml 恢复模板。
# 本轮改动（用户要求，其余字段逐项保留上游默认）：
#   1. filters 只保留 3 条黑名单：海哥的清单、anti-AD、刘淳的清单；删除原有 21 条。
#   2. dns.upstream_dns：114.114.114.114 与 223.5.5.5。
#   3. dns.enable_dnssec：true（用户原文「DNSESC」，按 DNSSEC 处理）。
#   4. DNS 缓存：cache_size 4194304（>0 即启用），覆盖最小/最大 TTL 为 120 / 7200。
bind_host: 0.0.0.0
bind_port: 3000
beta_bind_port: 0
users:
  - name: admin
    password: $2y$10$vHRcARdPCieYG3RXWomV5evDYN.Nj/edtwEkQgQJZcK6z7qTLaIc6
auth_attempts: 5
block_auth_min: 15
http_proxy: ""
language: zh-cn
rlimit_nofile: 0
debug_pprof: false
web_session_ttl: 720
dns:
  bind_hosts:
  - 0.0.0.0
  port: 5553
  statistics_interval: 1
  querylog_enabled: true
  querylog_file_enabled: true
  querylog_interval: 1
  querylog_size_memory: 1000
  anonymize_client_ip: false
  protection_enabled: true
  blocking_mode: default
  blocking_ipv4: ""
  blocking_ipv6: ""
  blocked_response_ttl: 10
  parental_block_host: family-block.dns.adguard.com
  safebrowsing_block_host: standard-block.dns.adguard.com
  ratelimit: 0
  ratelimit_whitelist: []
  refuse_any: false
  upstream_dns:
    - 114.114.114.114
    - 223.5.5.5
  upstream_dns_file: ""
  bootstrap_dns:
    - 119.29.29.29
    - 223.5.5.5
  all_servers: false
  fastest_addr: false
  fastest_timeout: 1s
  allowed_clients: []
  disallowed_clients: []
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128
  cache_size: 4194304
  cache_ttl_min: 120
  cache_ttl_max: 7200
  cache_optimistic: true
  bogus_nxdomain: []
  aaaa_disabled: false
  enable_dnssec: true
  edns_client_subnet: false
  max_goroutines: 300
  ipset: []
  filtering_enabled: true
  filters_update_interval: 24
  parental_enabled: false
  safesearch_enabled: false
  safebrowsing_enabled: false
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  cache_time: 30
  rewrites: []
  blocked_services: []
  upstream_timeout: 10s
  local_domain_name: lan
  resolve_clients: true
  use_private_ptr_resolvers: true
  local_ptr_upstreams: []
tls:
  enabled: false
  server_name: ""
  force_https: false
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 784
  port_dnscrypt: 0
  dnscrypt_config_file: ""
  allow_unencrypted_doh: false
  strict_sni_check: false
  certificate_chain: ""
  private_key: ""
  certificate_path: ""
  private_key_path: ""
filters:
  - enabled: true
    url: https://ghproxy.net/https://raw.githubusercontent.com/2771936993/HG/main/hg1.txt
    name: 海哥的清单
    id: 1001
  - enabled: true
    url: https://anti-ad.net/adguard.txt
    name: anti-AD
    id: 1002
  - enabled: true
    url: https://ghproxy.net/https://raw.githubusercontent.com/GXLCLC/Ad-blocking-list/refs/heads/main/adlist
    name: 刘淳的清单
    id: 1003
whitelist_filters: []
user_rules:
  - '@@||taobao.com^$important'
  - '@@||tmall.com^$important'
  - '@@||jd.com^important'
  - '@@||flyme.cn^$important'
  - '@@||meizu.com^$important'
  - '@@||wl.jd.com^$important'
  - '@@||flydigi.com^'
  - '@@||pv.sohu.com^$important'
  - /googleads.$~script,domain=~googleads.github.io
  - /pagead/lvz?
  - '||google.com/pagead/'
  - '||static.doubleclick.net^$domain=youtube.com'
  - '||youtube.com/get_midroll_'
  - '||5hz.org^'
  - '@@||000714.xyz^'
  - '@@||blueskyxn.com^'
  - '||topnewsfeeds.net^'
  - '||nbryb.com^'
  - '||superbdolly.com^'
  - '||salutationcheerlessdemote.com^'
  - '||buildingdoodlesquare.com^'
  - '||colonistnobilityheroic.com^'
dhcp:
  enabled: false
  interface_name: ""
  dhcpv4:
    gateway_ip: ""
    subnet_mask: ""
    range_start: ""
    range_end: ""
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options: []
  dhcpv6:
    range_start: ""
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false
clients: []
log_compress: false
log_localtime: false
log_max_backups: 0
log_max_size: 100
log_max_age: 3
log_file: ""
verbose: false
schema_version: 10
